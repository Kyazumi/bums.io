<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate — shared availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B2420;
    --bg-2:#212C26;
    --panel:#26332C;
    --panel-2:#2C3B33;
    --line: rgba(242,240,230,0.12);
    --chalk:#F2F0E6;
    --muted:#9FB0A6;
    --gold:#F4D35E;
    --danger:#EF7C7C;
    --free:#7FCB9A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 10% 0%, rgba(244,211,94,0.05), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(127,203,154,0.06), transparent 50%),
      var(--bg);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
  }
  h1,h2,h3,.brand{font-family:'Caveat',cursive;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  /* ---------- Auth screen ---------- */
  #auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .auth-card h1{
    font-size:42px;
    margin:0 0 2px;
    color:var(--gold);
  }
  .auth-card .tagline{
    color:var(--muted);
    font-size:13px;
    margin-bottom:22px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
    letter-spacing:0.3px;
  }
  .field input{
    width:100%;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 12px;
    color:var(--chalk);
    font-size:14px;
  }
  .field input:focus{outline:none;border-color:var(--gold);}
  .auth-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    background:var(--gold);
    color:#241C05;
    font-weight:700;
    font-size:14.5px;
    margin-top:6px;
  }
  .auth-btn:hover{filter:brightness(1.06);}
  .auth-switch{
    text-align:center;
    margin-top:16px;
    font-size:13px;
    color:var(--muted);
  }
  .auth-switch a{color:var(--free);text-decoration:none;cursor:pointer;}
  .auth-error{
    color:var(--danger);
    font-size:12.5px;
    margin-top:10px;
    min-height:16px;
  }

  /* ---------- App shell ---------- */
  #app-screen{display:none;min-height:100vh;flex-direction:column;}
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:var(--bg-2);
    flex-wrap:wrap;
    gap:10px;
  }
  .topbar .brand{font-size:28px;color:var(--gold);}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .user-badge{
    display:flex;align-items:center;gap:7px;
    font-size:13.5px;
    padding:6px 12px 6px 8px;
    background:var(--panel);
    border-radius:20px;
    border:1px solid var(--line);
  }
  .swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .btn-ghost{
    background:none;
    border:1px solid var(--line);
    color:var(--chalk);
    padding:7px 13px;
    border-radius:8px;
    font-size:13px;
  }
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn-ghost.active{background:var(--gold);color:#241C05;border-color:var(--gold);}

  main{flex:1;padding:22px 24px 60px;max-width:1100px;margin:0 auto;width:100%;}

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:12px;
  }
  .nav-group{display:flex;align-items:center;gap:10px;}
  .nav-group button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--chalk);
    width:34px;height:34px;
    border-radius:8px;
    font-size:16px;
  }
  .nav-group button:hover{border-color:var(--gold);}
  .nav-title{font-size:26px;font-family:'Caveat',cursive;color:var(--chalk);min-width:150px;text-align:center;}

  .mode-toggle{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line);}

  .legend{
    display:flex;flex-wrap:wrap;gap:10px;
    margin-bottom:16px;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .legend .item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}

  /* ---------- Year grid ---------- */
  .year-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  .month-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s, transform 0.1s;
  }
  .month-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .month-card .mname{font-family:'Caveat',cursive;font-size:26px;color:var(--chalk);}
  .month-card .mmeta{font-size:11.5px;color:var(--muted);margin-top:4px;}

  /* ---------- Month grid ---------- */
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
    margin-bottom:8px;
  }
  .weekdays div{
    text-align:center;
    font-size:11px;
    letter-spacing:0.6px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
  }
  .day-cell{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    min-height:86px;
    padding:8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition:border-color 0.15s;
  }
  .day-cell:hover{border-color:var(--gold);}
  .day-cell.empty{background:none;border:none;cursor:default;}
  .day-cell .dnum{font-size:13px;font-weight:600;color:var(--chalk);}
  .day-cell.today .dnum{color:var(--gold);}
  .status-pill{
    font-size:10.5px;
    padding:2px 6px;
    border-radius:6px;
    display:inline-block;
    width:fit-content;
  }
  .status-pill.free{background:rgba(127,203,154,0.18);color:var(--free);}
  .status-pill.unavailable{background:rgba(239,124,124,0.18);color:var(--danger);}
  .status-pill.none{background:rgba(159,176,166,0.15);color:var(--muted);}
  .dots-row{display:flex;flex-wrap:wrap;gap:4px;}
  .dot{width:9px;height:9px;border-radius:50%;}
  .dot.hollow{opacity:0.25;}
  .overlap-badge{
    margin-top:auto;
    font-size:10px;
    color:#241C05;
    background:var(--gold);
    border-radius:5px;
    padding:2px 5px;
    width:fit-content;
  }

  /* ---------- Modal ---------- */
  .overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,14,12,0.6);
    align-items:center;justify-content:center;
    z-index:50;
    padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    width:100%;max-width:460px;
    max-height:88vh;
    overflow-y:auto;
    padding:24px;
  }
  .modal h2{margin:0 0 3px;font-size:28px;color:var(--gold);}
  .modal .subdate{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .toggle-row span{font-size:13.5px;}
  .switch{
    position:relative;width:40px;height:22px;
    background:#3a473f;border-radius:20px;
    cursor:pointer;flex-shrink:0;
  }
  .switch.on{background:var(--danger);}
  .switch .knob{
    position:absolute;top:2px;left:2px;
    width:18px;height:18px;border-radius:50%;
    background:var(--chalk);
    transition:left 0.15s;
  }
  .switch.on .knob{left:20px;}
  .ranges-list{margin-bottom:12px;}
  .range-row{
    display:flex;align-items:center;gap:8px;
    margin-bottom:8px;
  }
  .range-row input[type=time]{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px;
    color:var(--chalk);
    font-size:13px;
    flex:1;
  }
  .range-row .rm{
    background:none;border:none;color:var(--muted);font-size:16px;
  }
  .range-row .rm:hover{color:var(--danger);}
  .add-range{
    background:none;border:1px dashed var(--line);color:var(--muted);
    border-radius:8px;padding:8px;width:100%;font-size:12.5px;
  }
  .add-range:hover{border-color:var(--free);color:var(--free);}
  .quick-actions{display:flex;gap:8px;margin:14px 0;}
  .quick-actions button{
    flex:1;background:var(--bg-2);border:1px solid var(--line);color:var(--chalk);
    border-radius:8px;padding:8px;font-size:12px;
  }
  .quick-actions button:hover{border-color:var(--gold);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions button{flex:1;padding:11px;border-radius:9px;border:none;font-weight:600;font-size:13.5px;}
  .btn-save{background:var(--gold);color:#241C05;}
  .btn-cancel{background:var(--bg-2);color:var(--chalk);border:1px solid var(--line) !important;}

  .team-user-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .team-user-row:last-child{border-bottom:none;}
  .team-user-row .name{display:flex;align-items:center;gap:8px;}
  .overlap-box{
    margin-top:16px;padding:12px 14px;
    background:rgba(244,211,94,0.1);
    border:1px solid rgba(244,211,94,0.35);
    border-radius:10px;
  }
  .overlap-box h3{margin:0 0 6px;font-size:15px;color:var(--gold);}
  .overlap-box p{margin:0;font-size:13px;color:var(--chalk);line-height:1.6;}

  .settings-menu{position:relative;}
  .settings-dropdown{
    display:none;position:absolute;right:0;top:calc(100% + 8px);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:6px;min-width:170px;z-index:40;
  }
  .settings-dropdown.show{display:block;}
  .settings-dropdown button{
    display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--chalk);padding:9px 10px;border-radius:7px;font-size:13px;
  }
  .settings-dropdown button:hover{background:var(--bg-2);}
  #import-file{display:none;}

  @media (max-width:700px){
    .year-grid{grid-template-columns:repeat(2,1fr);}
    .day-cell{min-height:64px;padding:6px;}
    main{padding:16px 12px 50px;}
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen">
  <div class="auth-card">
    <h1 class="brand">Slate</h1>
    <div class="tagline">a shared calendar for figuring out when everyone's actually free</div>

    <div id="login-form">
      <div class="field"><label>Username</label><input type="text" id="login-username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" autocomplete="current-password"></div>
      <button class="auth-btn" id="login-btn">Log in</button>
      <div class="auth-error" id="login-error"></div>
      <div class="auth-switch">New here? <a id="show-register">Create an account</a></div>
    </div>

    <div id="register-form" style="display:none;">
      <div class="field"><label>Choose a username</label><input type="text" id="reg-username"></div>
      <div class="field"><label>Choose a password</label><input type="password" id="reg-password"></div>
      <div class="field"><label>Confirm password</label><input type="password" id="reg-password2"></div>
      <button class="auth-btn" id="register-btn">Sign up</button>
      <div class="auth-error" id="register-error"></div>
      <div class="auth-switch">Already registered? <a id="show-login">Log in</a></div>
    </div>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="app-screen">
  <header class="topbar">
    <div class="brand">Slate</div>
    <div class="topbar-right">
      <div class="user-badge"><span class="swatch" id="my-swatch"></span><span id="my-username"></span></div>
      <div class="settings-menu">
        <button class="btn-ghost" id="settings-btn">⚙ Data</button>
        <div class="settings-dropdown" id="settings-dropdown">
          <button id="export-btn">Export data (.json)</button>
          <button id="import-btn">Import data (.json)</button>
        </div>
        <input type="file" id="import-file" accept=".json">
      </div>
      <button class="btn-ghost" id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="nav-group" id="nav-group">
        <button id="nav-prev">‹</button>
        <div class="nav-title" id="nav-title"></div>
        <button id="nav-next">›</button>
      </div>
      <div class="mode-toggle">
        <button class="btn-ghost active" id="mode-mine">My schedule</button>
        <button class="btn-ghost" id="mode-team">Team overlap</button>
      </div>
    </div>

    <div class="legend" id="legend" style="display:none;"></div>

    <div id="view-year"></div>
    <div id="view-month" style="display:none;">
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="month-grid" id="month-grid"></div>
    </div>
  </main>
</div>

<!-- ================= DAY EDITOR MODAL (my schedule) ================= -->
<div class="overlay" id="day-modal">
  <div class="modal">
    <h2>Set availability</h2>
    <div class="subdate" id="day-modal-date"></div>

    <div class="toggle-row">
      <span>Unavailable all day</span>
      <div class="switch" id="unavailable-switch"><div class="knob"></div></div>
    </div>

    <div id="ranges-section">
      <div class="ranges-list" id="ranges-list"></div>
      <button class="add-range" id="add-range-btn">+ add a time range</button>
      <div class="quick-actions">
        <button id="quick-free-all">Mark free all day</button>
        <button id="quick-clear">Clear</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="day-cancel">Cancel</button>
      <button class="btn-save" id="day-save">Save</button>
    </div>
  </div>
</div>

<!-- ================= TEAM DAY DETAIL MODAL ================= -->
<div class="overlay" id="team-modal">
  <div class="modal">
    <h2>Team availability</h2>
    <div class="subdate" id="team-modal-date"></div>
    <div id="team-user-list"></div>
    <div class="overlap-box">
      <h3>When everyone's free</h3>
      <p id="overlap-text"></p>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="team-close" style="flex:1;">Close</button>
    </div>
  </div>
</div>

<script>
/* ===================== Storage helpers ===================== */
const USERS_KEY = 'slate_users';          // { username: { passHash, color } }
const AVAIL_KEY = 'slate_availability';   // { username: { 'YYYY-MM-DD': { unavailable:bool, ranges:[{start,end}] } } }
const SESSION_KEY = 'slate_session';      // username string

const COLOR_PALETTE = ['#FF8A65','#4FC3F7','#AED581','#F06292','#FFD54F','#BA68C8','#4DB6AC','#FFAB91','#9575CD','#DCE775','#F48FB1','#80CBC4'];

function loadUsers(){ return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
function saveUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function loadAvail(){ return JSON.parse(localStorage.getItem(AVAIL_KEY) || '{}'); }
function saveAvail(a){ localStorage.setItem(AVAIL_KEY, JSON.stringify(a)); }

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function nextColor(){
  const users = loadUsers();
  const used = Object.values(users).map(u => u.color);
  for(const c of COLOR_PALETTE){ if(!used.includes(c)) return c; }
  // ran out of palette — derive a new hue
  return `hsl(${Math.floor(Math.random()*360)}, 65%, 65%)`;
}

/* ===================== Session / auth ===================== */
let currentUser = null;

function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

document.getElementById('show-register').addEventListener('click', () => {
  document.getElementById('login-form').style.display='none';
  document.getElementById('register-form').style.display='block';
});
document.getElementById('show-login').addEventListener('click', () => {
  document.getElementById('register-form').style.display='none';
  document.getElementById('login-form').style.display='block';
});

document.getElementById('register-btn').addEventListener('click', async () => {
  const uname = document.getElementById('reg-username').value.trim();
  const pass = document.getElementById('reg-password').value;
  const pass2 = document.getElementById('reg-password2').value;
  const errEl = document.getElementById('register-error');
  errEl.textContent = '';
  if(!uname || !pass){ errEl.textContent = 'Enter a username and password.'; return; }
  if(pass !== pass2){ errEl.textContent = 'Passwords don\u2019t match.'; return; }
  const users = loadUsers();
  if(users[uname]){ errEl.textContent = 'That username is taken.'; return; }
  const passHash = await sha256(pass);
  users[uname] = { passHash, color: nextColor() };
  saveUsers(users);
  localStorage.setItem(SESSION_KEY, uname);
  enterApp(uname);
});

document.getElementById('login-btn').addEventListener('click', async () => {
  const uname = document.getElementById('login-username').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  const users = loadUsers();
  if(!users[uname]){ errEl.textContent = 'No account with that username.'; return; }
  const passHash = await sha256(pass);
  if(users[uname].passHash !== passHash){ errEl.textContent = 'Wrong password.'; return; }
  localStorage.setItem(SESSION_KEY, uname);
  enterApp(uname);
});

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
});

/* ===================== App state ===================== */
let viewMode = 'mine'; // 'mine' | 'team'
let viewLevel = 'year'; // 'year' | 'month'
let curYear = new Date().getFullYear();
let curMonth = new Date().getMonth(); // 0-indexed

function enterApp(uname){
  currentUser = uname;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  const users = loadUsers();
  document.getElementById('my-username').textContent = uname;
  document.getElementById('my-swatch').style.background = users[uname].color;
  renderLegend();
  renderNav();
  renderCurrentView();
}

// auto-login if session exists
(function tryAutoLogin(){
  const saved = localStorage.getItem(SESSION_KEY);
  const users = loadUsers();
  if(saved && users[saved]) enterApp(saved);
})();

/* ===================== Nav & mode ===================== */
document.getElementById('mode-mine').addEventListener('click', () => setMode('mine'));
document.getElementById('mode-team').addEventListener('click', () => setMode('team'));
function setMode(m){
  viewMode = m;
  document.getElementById('mode-mine').classList.toggle('active', m==='mine');
  document.getElementById('mode-team').classList.toggle('active', m==='team');
  document.getElementById('legend').style.display = m==='team' ? 'flex' : 'none';
  renderCurrentView();
}

document.getElementById('nav-prev').addEventListener('click', () => {
  if(viewLevel === 'year'){ curYear--; }
  else { curMonth--; if(curMonth<0){curMonth=11;curYear--;} }
  renderNav(); renderCurrentView();
});
document.getElementById('nav-next').addEventListener('click', () => {
  if(viewLevel === 'year'){ curYear++; }
  else { curMonth++; if(curMonth>11){curMonth=0;curYear++;} }
  renderNav(); renderCurrentView();
});

function renderNav(){
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('nav-title').textContent = viewLevel === 'year' ? curYear : `${MONTH_NAMES[curMonth]} ${curYear}`;
}

function renderLegend(){
  const users = loadUsers();
  const el = document.getElementById('legend');
  el.innerHTML = Object.entries(users).map(([name,u]) =>
    `<div class="item"><span class="swatch" style="background:${u.color}"></span>${name}</div>`
  ).join('');
}

function goToMonth(m){
  curMonth = m;
  viewLevel = 'month';
  document.getElementById('view-year').style.display = 'none';
  document.getElementById('view-month').style.display = 'block';
  renderNav();
  renderCurrentView();
}
function goToYear(){
  viewLevel = 'year';
  document.getElementById('view-year').style.display = 'block';
  document.getElementById('view-month').style.display = 'none';
  renderNav();
  renderCurrentView();
}
// allow clicking the year title while in month view to pop back up
document.getElementById('nav-title').addEventListener('click', () => { if(viewLevel==='month') goToYear(); });
document.getElementById('nav-title').style.cursor = 'pointer';

function renderCurrentView(){
  if(viewLevel === 'year') renderYearView(); else renderMonthView();
}

/* ===================== Year view ===================== */
function renderYearView(){
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const avail = loadAvail();
  const mine = avail[currentUser] || {};
  const el = document.getElementById('view-year');
  el.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'year-grid';
  for(let m=0; m<12; m++){
    const daysInMonth = new Date(curYear, m+1, 0).getDate();
    let setCount = 0;
    for(let d=1; d<=daysInMonth; d++){ if(mine[isoDate(curYear,m,d)]) setCount++; }
    const card = document.createElement('div');
    card.className = 'month-card';
    card.innerHTML = `<div class="mname">${MONTH_NAMES[m]}</div><div class="mmeta">${setCount ? setCount+' day(s) set' : 'nothing set'}</div>`;
    card.addEventListener('click', () => goToMonth(m));
    grid.appendChild(card);
  }
  el.appendChild(grid);
}

/* ===================== Month view ===================== */
function renderMonthView(){
  const users = loadUsers();
  const avail = loadAvail();
  const grid = document.getElementById('month-grid');
  grid.innerHTML = '';

  const firstWeekday = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const todayIso = isoDate(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

  for(let i=0;i<firstWeekday;i++){
    const c = document.createElement('div');
    c.className='day-cell empty';
    grid.appendChild(c);
  }

  for(let d=1; d<=daysInMonth; d++){
    const iso = isoDate(curYear, curMonth, d);
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (iso===todayIso ? ' today' : '');
    const dnum = document.createElement('div');
    dnum.className = 'dnum';
    dnum.textContent = d;
    cell.appendChild(dnum);

    if(viewMode === 'mine'){
      const entry = (avail[currentUser]||{})[iso];
      const pill = document.createElement('div');
      if(!entry){
        pill.className='status-pill none'; pill.textContent='not set';
      } else if(entry.unavailable){
        pill.className='status-pill unavailable'; pill.textContent='unavailable';
      } else {
        pill.className='status-pill free';
        pill.textContent = summarizeRanges(entry.ranges);
      }
      cell.appendChild(pill);
      cell.addEventListener('click', () => openDayModal(iso));
    } else {
      // team mode
      const dotsRow = document.createElement('div');
      dotsRow.className = 'dots-row';
      let activeUsers = [];
      Object.entries(users).forEach(([uname,u]) => {
        const entry = (avail[uname]||{})[iso];
        const hasFree = entry && !entry.unavailable && entry.ranges && entry.ranges.length;
        const dot = document.createElement('div');
        dot.className = 'dot' + (hasFree ? '' : ' hollow');
        dot.style.background = u.color;
        dot.title = uname + (hasFree ? ' — free' : entry && entry.unavailable ? ' — unavailable' : ' — not set');
        dotsRow.appendChild(dot);
        if(hasFree) activeUsers.push({uname, ranges: entry.ranges});
      });
      cell.appendChild(dotsRow);

      if(activeUsers.length >= 2){
        const overlap = intersectMany(activeUsers.map(a => a.ranges));
        if(overlap.length){
          const badge = document.createElement('div');
          badge.className = 'overlap-badge';
          badge.textContent = '★ ' + overlap.length + ' shared slot' + (overlap.length>1?'s':'');
          cell.appendChild(badge);
        }
      }
      cell.addEventListener('click', () => openTeamModal(iso));
    }

    grid.appendChild(cell);
  }
}

function summarizeRanges(ranges){
  if(!ranges || !ranges.length) return 'free (no times set)';
  return ranges.map(r => `${r.start}–${r.end}`).join(', ');
}

/* ===================== Time interval helpers ===================== */
function toMinutes(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function toHHMM(mins){ return pad(Math.floor(mins/60)) + ':' + pad(mins%60); }

function intersectTwo(a, b){
  // a, b: arrays of {start,end} in HH:MM, return intersection as array of {start,end}
  const A = a.map(r => [toMinutes(r.start), toMinutes(r.end)]).sort((x,y)=>x[0]-y[0]);
  const B = b.map(r => [toMinutes(r.start), toMinutes(r.end)]).sort((x,y)=>x[0]-y[0]);
  const out = [];
  let i=0, j=0;
  while(i<A.length && j<B.length){
    const s = Math.max(A[i][0], B[j][0]);
    const e = Math.min(A[i][1], B[j][1]);
    if(s < e) out.push([s,e]);
    if(A[i][1] < B[j][1]) i++; else j++;
  }
  return out.map(([s,e]) => ({start: toHHMM(s), end: toHHMM(e)}));
}
function intersectMany(rangeSets){
  if(!rangeSets.length) return [];
  let acc = rangeSets[0];
  for(let k=1;k<rangeSets.length;k++){
    acc = intersectTwo(acc, rangeSets[k]);
    if(!acc.length) return [];
  }
  return acc;
}

/* ===================== Day editor modal (mine) ===================== */
let editingDate = null;
let editingRanges = [];
let editingUnavailable = false;

function openDayModal(iso){
  editingDate = iso;
  const avail = loadAvail();
  const entry = (avail[currentUser]||{})[iso];
  editingUnavailable = entry ? !!entry.unavailable : false;
  editingRanges = entry && entry.ranges ? JSON.parse(JSON.stringify(entry.ranges)) : [];
  document.getElementById('day-modal-date').textContent = prettyDate(iso);
  syncUnavailableSwitch();
  renderRangesList();
  document.getElementById('day-modal').classList.add('show');
}
function prettyDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
function syncUnavailableSwitch(){
  const sw = document.getElementById('unavailable-switch');
  sw.classList.toggle('on', editingUnavailable);
  document.getElementById('ranges-section').style.opacity = editingUnavailable ? '0.35' : '1';
  document.getElementById('ranges-section').style.pointerEvents = editingUnavailable ? 'none' : 'auto';
}
document.getElementById('unavailable-switch').addEventListener('click', () => {
  editingUnavailable = !editingUnavailable;
  syncUnavailableSwitch();
});
function renderRangesList(){
  const list = document.getElementById('ranges-list');
  list.innerHTML = '';
  editingRanges.forEach((r, idx) => {
    const row = document.createElement('div');
    row.className = 'range-row';
    row.innerHTML = `
      <input type="time" value="${r.start}" data-idx="${idx}" data-field="start">
      <span class="mono" style="color:var(--muted);">to</span>
      <input type="time" value="${r.end}" data-idx="${idx}" data-field="end">
      <button class="rm" data-idx="${idx}">&times;</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input[type=time]').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = +e.target.dataset.idx, field = e.target.dataset.field;
      editingRanges[idx][field] = e.target.value;
    });
  });
  list.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', e => {
      editingRanges.splice(+e.target.dataset.idx, 1);
      renderRangesList();
    });
  });
}
document.getElementById('add-range-btn').addEventListener('click', () => {
  editingRanges.push({start:'09:00', end:'17:00'});
  renderRangesList();
});
document.getElementById('quick-free-all').addEventListener('click', () => {
  editingRanges = [{start:'00:00', end:'23:59'}];
  renderRangesList();
});
document.getElementById('quick-clear').addEventListener('click', () => {
  editingRanges = [];
  renderRangesList();
});
document.getElementById('day-cancel').addEventListener('click', () => {
  document.getElementById('day-modal').classList.remove('show');
});
document.getElementById('day-save').addEventListener('click', () => {
  const avail = loadAvail();
  if(!avail[currentUser]) avail[currentUser] = {};
  if(editingUnavailable){
    avail[currentUser][editingDate] = { unavailable:true, ranges:[] };
  } else if(editingRanges.length === 0) {
    delete avail[currentUser][editingDate];
  } else {
    avail[currentUser][editingDate] = { unavailable:false, ranges: editingRanges };
  }
  saveAvail(avail);
  document.getElementById('day-modal').classList.remove('show');
  renderCurrentView();
});

/* ===================== Team day detail modal ===================== */
function openTeamModal(iso){
  const users = loadUsers();
  const avail = loadAvail();
  document.getElementById('team-modal-date').textContent = prettyDate(iso);
  const listEl = document.getElementById('team-user-list');
  listEl.innerHTML = '';
  const activeRangeSets = [];

  Object.entries(users).forEach(([uname,u]) => {
    const entry = (avail[uname]||{})[iso];
    let statusText;
    if(!entry) statusText = 'no data';
    else if(entry.unavailable) statusText = 'unavailable';
    else statusText = summarizeRanges(entry.ranges);

    const row = document.createElement('div');
    row.className = 'team-user-row';
    row.innerHTML = `<div class="name"><span class="swatch" style="background:${u.color}"></span>${uname}</div><div class="mono" style="color:var(--muted);font-size:12px;">${statusText}</div>`;
    listEl.appendChild(row);

    if(entry && !entry.unavailable && entry.ranges && entry.ranges.length){
      activeRangeSets.push(entry.ranges);
    }
  });

  const overlapEl = document.getElementById('overlap-text');
  const totalUsers = Object.keys(users).length;
  if(activeRangeSets.length < totalUsers || activeRangeSets.length < 2){
    overlapEl.textContent = activeRangeSets.length < 2
      ? 'Not enough people have marked specific free times this day to compare.'
      : 'Everyone hasn\u2019t marked availability yet — showing overlap for those who have:';
  }
  const overlap = intersectMany(activeRangeSets);
  const summary = overlap.length ? overlap.map(r => `${r.start}–${r.end}`).join(', ') : 'No common free window found.';
  overlapEl.textContent += (overlapEl.textContent ? ' ' : '') + summary;

  document.getElementById('team-modal').classList.add('show');
}
document.getElementById('team-close').addEventListener('click', () => {
  document.getElementById('team-modal').classList.remove('show');
});

/* ===================== Settings: export / import ===================== */
document.getElementById('settings-btn').addEventListener('click', () => {
  document.getElementById('settings-dropdown').classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if(!e.target.closest('.settings-menu')) document.getElementById('settings-dropdown').classList.remove('show');
});
document.getElementById('export-btn').addEventListener('click', () => {
  const data = { users: loadUsers(), availability: loadAvail() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'slate-data.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const incoming = JSON.parse(reader.result);
      if(!confirm('Merge this file into your local data? Matching usernames/dates will be overwritten by the imported file.')) return;
      const users = loadUsers();
      Object.assign(users, incoming.users || {});
      saveUsers(users);
      const avail = loadAvail();
      Object.entries(incoming.availability || {}).forEach(([uname, days]) => {
        if(!avail[uname]) avail[uname] = {};
        Object.assign(avail[uname], days);
      });
      saveAvail(avail);
      renderLegend();
      renderCurrentView();
      alert('Import complete.');
    } catch(err){
      alert('That file doesn\u2019t look like valid Slate data.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
</script>
